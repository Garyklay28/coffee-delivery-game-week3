const shopEl=document.querySelector('#shop'),shopLabels={beauty:['마을 미화','거리를 꽃과 등불로 꾸며 손님 기분이 좋아지고, 커피 가격이 올라가요.'],quality:['카페 확장 · 원두 품질','가게가 넓어지고 좋은 원두가 들어와 커피 가격이 올라가요.'],houses:['새 이웃집','배달할 새 이웃집을 하나 더 열어요. 손님이 늘면 한 라운드 수입도 늘어요.']};
const shopKeyNum={beauty:1,quality:2,houses:3};
function renderShop(){
 const s=game.state,e=s.economy;
 document.querySelector('#shopCoins').textContent='보유 코인 '+e.coins.toLocaleString('ko-KR')+'개  ·  ≈ ₩'+(e.coins*Daldongne.KRW_PER_COIN).toLocaleString('ko-KR');
 shopEl.querySelectorAll('.row').forEach(row=>{
  const key=row.dataset.key,info=Daldongne.upgradeInfo(s,key),[label,desc]=shopLabels[key],num=shopKeyNum[key];
  row.querySelector('.info').innerHTML='<b>'+label+' · Lv.'+info.level+'/'+info.max+'</b><br>'+desc;
  const btn=row.querySelector('.buy');
  if(info.maxed){btn.textContent='최고 레벨';btn.disabled=true}
  else{btn.textContent='('+num+') 구매 · '+info.cost+'코인';btn.disabled=e.coins<info.cost}
 });
 shopEl.querySelectorAll('.decorPick button').forEach(b=>b.classList.toggle('active',e.decorStyle===b.dataset.style));
 const slots=Daldongne.menuSlots(s),cost=Daldongne.menuCost(s),menuEl=document.querySelector('#menuList');
 menuEl.innerHTML='<h3>☕ 카페 메뉴 <small>'+e.menu.length+'/'+Daldongne.MENU.length+' · '+Daldongne.nextMenuText(s)+'</small></h3>'+Daldongne.MENU.map((m,i)=>{
  const owned=e.menu.includes(m.id);
  return '<div class="mrow"><span>'+m.icon+' '+m.name+' <small>('+(m.kind==='snack'?'간식':'음료')+' · 가격 +12%)</small></span><button data-menu="'+m.id+'"'+(owned||slots<1||e.coins<cost?' disabled':'')+'>'+(owned?'판매 중':'('+(i+4)+') 추가 · '+cost+'코인')+'</button></div>'}).join('');
 menuEl.querySelectorAll('button[data-menu]').forEach(b=>b.onclick=()=>buyMenuAndRefresh(b.dataset.menu));
}
const buyMenuAndRefresh=id=>{if(!Daldongne.buyMenu(game.state,id))return false;renderShop();renderLevelChoice();return true};
const buyAndToast=key=>{const r=Daldongne.buyUpgrade(game.state,key);if(!r)return false;if(r.bonusHouse){game.state.message='마을을 꾸미다가 새 이웃을 발견했어요!';game.state.messageTime=6}renderShop();renderLevelChoice();return true};
const openShop=()=>{renderShop();shopEl.classList.remove('hidden')};
const closeShop=()=>shopEl.classList.add('hidden');
document.querySelector('#shopBtn').onclick=openShop;
document.querySelector('#shopClose').onclick=closeShop;
shopEl.querySelectorAll('.buy').forEach(btn=>btn.onclick=()=>buyAndToast(btn.closest('.row').dataset.key));
shopEl.querySelectorAll('.decorPick button').forEach(btn=>btn.onclick=()=>{Daldongne.setDecorStyle(game.state,btn.dataset.style);renderShop()});
const shopKeys=['beauty','quality','houses'];
const levelChoiceEl=document.querySelector('#levelChoice');
function renderLevelChoice(){
 const s=game.state;
 if(s.status!=='won'){levelChoiceEl.classList.add('hidden');levelChoiceEl.innerHTML='';return}
 levelChoiceEl.classList.remove('hidden');
 const lvl=s.level||1;
 const qInfo=Daldongne.upgradeInfo(s,'quality'),bInfo=Daldongne.upgradeInfo(s,'beauty'),hInfo=Daldongne.upgradeInfo(s,'houses');
 const slots=Daldongne.menuSlots(s),allMenu=s.economy.menu.length>=Daldongne.MENU.length,nextGoal=Daldongne.stageGoal(s,lvl+1);
 const menuBtn=allMenu?'<button id="lcMenu" disabled>🍰 메뉴 완성</button>':slots>0?'<button id="lcMenu">🍰 메뉴 추가 (슬롯 '+slots+')</button>':'';
 levelChoiceEl.innerHTML='<button id="lcQuality">☕ 카페 확장 · '+(qInfo.maxed?'MAX':qInfo.cost+'코인')+'</button><button id="lcDecor">🌿 마을 꾸미기 · '+(bInfo.maxed?'MAX':bInfo.cost+'코인')+'</button><button id="lcHouses">🧑‍🤝‍🧑 이웃 늘리기 · '+(hInfo.maxed?'MAX':hInfo.cost+'코인')+'</button>'+menuBtn+'<button id="lcNext">☕ 다음 스테이지로 ('+nextGoal+'잔)</button>';
 const qb=document.querySelector('#lcQuality');qb.disabled=qInfo.maxed||s.economy.coins<qInfo.cost;qb.onclick=()=>buyAndToast('quality');
 const db=document.querySelector('#lcDecor');db.disabled=bInfo.maxed||s.economy.coins<bInfo.cost;db.onclick=()=>buyAndToast('beauty');
 const hb=document.querySelector('#lcHouses');hb.disabled=hInfo.maxed||s.economy.coins<hInfo.cost;hb.onclick=()=>buyAndToast('houses');
 const mb=document.querySelector('#lcMenu');if(mb&&!allMenu)mb.onclick=openShop;
 document.querySelector('#lcNext').onclick=()=>{game.start();document.querySelector('canvas').focus()};
}
const helpBubble=document.querySelector('#helpBubble'),helpBtn=document.querySelector('#helpBtn');
const openHelp=()=>helpBubble.classList.remove('hidden');
const closeHelp=()=>helpBubble.classList.add('hidden');
helpBtn.onclick=()=>helpBubble.classList.contains('hidden')?openHelp():closeHelp();
document.addEventListener('pointerdown',e=>{if(!helpBubble.classList.contains('hidden')&&!helpBubble.contains(e.target)&&e.target!==helpBtn)closeHelp()});
addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName))return;
 const k=e.key.toLowerCase();
 if(k==='b'){shopEl.classList.contains('hidden')?openShop():closeShop()}
 else if(k==='escape'){if(!shopEl.classList.contains('hidden'))closeShop();if(!helpBubble.classList.contains('hidden'))closeHelp()}
 else if(!shopEl.classList.contains('hidden')&&['1','2','3'].includes(k))buyAndToast(shopKeys[+k-1]);
 else if(!shopEl.classList.contains('hidden')&&/^[4-9]$/.test(k)){const m=Daldongne.MENU[+k-4];if(m)buyMenuAndRefresh(m.id)}
});</script></body></html>
